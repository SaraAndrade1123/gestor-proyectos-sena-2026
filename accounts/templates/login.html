{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Moderno</title>
    <!-- Tailwind CDN + fuente Waze (similar a 'Inter' o 'Nunito' por la estética) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuente 'Waze' no existe como tal, usamos 'Inter' que es la que usa Waze en su interfaz moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        /* reset básico para que la fuente se aplique limpia */
        * {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }
        /* tiny extra para darle un toque "waze" a los inputs */
        .input-waze {
            transition: all 0.2s ease;
            border: 1.5px solid #e2e8f0;
            background-color: white;
        }
        .input-waze:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            outline: none;
        }
        .btn-waze {
            background: #1a73e8;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(26, 115, 232, 0.2);
        }
        .btn-waze:hover {
            background: #1557b0;
            box-shadow: 0 6px 14px rgba(26, 115, 232, 0.3);
            transform: translateY(-1px);
        }
        .card-waze {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.15);
        }
    </style>
</head>
<body>

    <div class="w-full max-w-md px-4">
        <!-- Tarjeta principal con estilo moderno y sutil glassmorphism -->
        <div class="card-waze rounded-3xl p-8 md:p-10 shadow-2xl">
            
            <!-- Logo / cabecera minimal -->
            <div class="text-center mb-8">
                <span class="inline-block text-4xl font-semibold tracking-tight text-gray-800">
                    <img src="{% static 'img/michito.png' %}" alt="Logo!" class="w-20 h-20 rounded-full">
                </span>
                <h1 class="text-2xl font-bold text-gray-800 mt-1">Acceso</h1>
                <p class="text-sm text-gray-500 mt-1 font-medium">Bienvenido de vuelta</p>
            </div>

            <!-- FORMULARIO ÚNICO: todo dentro de un solo <form> como pide la estructura original -->
            <form action="{% url 'login' %}" method="post" class="space-y-6">
                {% csrf_token %}

                <!-- Campo Usuario -->
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-1.5">
                        Usuario
                    </label>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        placeholder="Nombre de usuario"
                        required
                        autofocus
                        value="{{ form.username.value|default:'' }}"
                        class="input-waze w-full px-4 py-3.5 rounded-2xl text-gray-800 placeholder:text-gray-400 text-sm transition-shadow"
                    />
                    <!-- pequeña ayuda visual (opcional) -->
                    <p class="text-xs text-gray-400 mt-1.5 pl-1">Ej: juan.perez</p>
                </div>

                <!-- Campo Contraseña -->
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-1.5">
                        Contraseña
                    </label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="𐔌՞ ܸ.ˬ.ܸ՞𐦯"
                        required
                        class="input-waze w-full px-4 py-3.5 rounded-2xl text-gray-800 placeholder:text-gray-400 text-sm transition-shadow"
                    />
                    <!-- mantengo el placeholder original que se veía divertido -->
                </div>

                <!-- Botón Entrar -->
                <div class="pt-2">
                    <button
                        type="submit"
                        class="btn-waze w-full py-3.5 rounded-2xl text-white font-semibold text-base tracking-wide transition-all"
                    >
                        Entrar
                    </button>
                </div>
            </form>

            <!-- Enlace a registro (exactamente igual que el original) -->
            <div class="mt-8 text-center text-sm text-gray-600 border-t border-gray-200/70 pt-6">
                <p>
                    ¿No tiene una cuenta?
                    <a href="{% url 'registro' %}" class="font-semibold text-[#1a73e8] hover:text-[#1557b0] transition-colors underline decoration-2 underline-offset-2 decoration-blue-200 hover:decoration-blue-400">
                        Registrar
                    </a>
                </p>
            </div>

            <!-- pequeña línea de "waze" estilo mapa -->
            <div class="mt-5 flex justify-center gap-1 text-gray-300 text-xs">
                <span>⬤</span><span>⬤</span><span>⬤</span>
            </div>
        </div>

        <!-- pie de página sutil (copy) -->
        <p class="text-center text-[11px] text-gray-400 mt-6 tracking-wider">
            ✦ experiencia moderna ✦
        </p>
    </div>

</body>
</html>
